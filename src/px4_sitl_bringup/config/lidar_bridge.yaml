# Move the simulated X500 point cloud from Gazebo Transport into ROS 2.
- ros_topic_name: "/x500/lidar/points"
  gz_topic_name: "/x500/lidar/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: false

# Share Gazebo simulation time with ROS 2 nodes and future rosbag recordings.
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
  qos_profile: CLOCK
  lazy: false
